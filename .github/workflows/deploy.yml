name: Production Checks

# Vercel's GitHub integration deploys `main` to production on its own.
# This workflow only runs the full check suite (lint, unit, e2e, build) on
# every push to main so a regression is visible right after a merge.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm test -- --passWithNoTests

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run e2e tests
      run: npm run test:e2e

    - name: Build application
      run: npm run build

    - name: Verify build
      run: |
        if [ -d ".next" ]; then
          echo "✓ Build verification passed"
        else
          echo "✗ Build verification failed"
          exit 1
        fi
