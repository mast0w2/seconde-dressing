name: Sync preprod from production

# Replaces the preprod Supabase data and storage files with a copy of production
# (scripts/sync-preprod.mjs): every night, and on demand from the Actions tab
# ("Run workflow"). Anything created on preprod since the last run is lost.
#
# Requires the SUPABASE_ACCESS_TOKEN repository secret (a Supabase personal
# access token). The table copy runs in a single transaction: if it fails,
# preprod is left untouched. The file copy follows and only transfers what
# changed. Either failure marks the run failed and GitHub emails it.

on:
  schedule:
    - cron: '0 2 * * *' # every night at 02:00 UTC
  workflow_dispatch:

# Never run two copies at once.
concurrency:
  group: sync-preprod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # The script only uses built-in Node modules: no npm install needed.
      - name: Copy production into preprod
        run: node scripts/sync-preprod.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
